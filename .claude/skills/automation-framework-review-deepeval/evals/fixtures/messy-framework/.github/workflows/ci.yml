name: CRM Admin UI Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  run-full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Run full TestNG suite
        run: mvn -B clean test

      - name: Print raw surefire output
        if: always()
        run: cat target/surefire-reports/*.txt || true
