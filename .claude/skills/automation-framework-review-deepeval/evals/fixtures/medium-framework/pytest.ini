[pytest]
# Consistent test_*.py discovery convention
python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

addopts =
    --html=report.html
    --self-contained-html
    -ra

reruns = 2
reruns_delay = 2

markers =
    smoke: quick smoke coverage across UI and API
    billing: subscription/billing domain tests
    tickets: support ticket domain tests
