name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Full regression suite nightly at 02:00 UTC.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  smoke:
    name: Smoke suite (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check (enforces tsconfig strict)
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run @smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.STAGING_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STANDARD_USERNAME: ${{ secrets.STAGING_STANDARD_USERNAME }}
          STANDARD_PASSWORD: ${{ secrets.STAGING_STANDARD_PASSWORD }}

      - name: Publish HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14

  full-regression:
    name: Full regression suite (merge / nightly)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check (enforces tsconfig strict)
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run full suite
        run: npm run test:full
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.STAGING_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          STANDARD_USERNAME: ${{ secrets.STAGING_STANDARD_USERNAME }}
          STANDARD_PASSWORD: ${{ secrets.STAGING_STANDARD_PASSWORD }}

      - name: Publish HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 30
