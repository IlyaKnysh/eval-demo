name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests
        env:
          SUBTRACK_BASE_URL: ${{ secrets.SUBTRACK_BASE_URL }}
          SUBTRACK_API_BASE_URL: ${{ secrets.SUBTRACK_API_BASE_URL }}
          SUBTRACK_ADMIN_USERNAME: ${{ secrets.SUBTRACK_ADMIN_USERNAME }}
          SUBTRACK_ADMIN_PASSWORD: ${{ secrets.SUBTRACK_ADMIN_PASSWORD }}
          SUBTRACK_API_TOKEN: ${{ secrets.SUBTRACK_API_TOKEN }}
        run: pytest --reruns 2 --reruns-delay 2

      - name: Publish HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: report.html

      - name: Publish Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: traces/
          if-no-files-found: ignore
